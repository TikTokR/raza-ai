
name: Build RAZA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build RAZA AI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK packages
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 5. Extract uploaded project ZIP
      - name: Extract RAZA AI project
        run: |
          set -e
          test -f RAZA_AI_COMPLETE_FIXED_PROJECT.zip
          mkdir -p build-src
          unzip -q RAZA_AI_COMPLETE_FIXED_PROJECT.zip -d build-src

          test -f build-src/RAZA_AI_Complete_Android_FIXED/settings.gradle.kts
          test -f build-src/RAZA_AI_Complete_Android_FIXED/app/build.gradle.kts

      # 6. Setup Gradle 8.9
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 7. Verify Java and Kotlin targets
      - name: Verify project configuration
        working-directory: build-src/RAZA_AI_Complete_Android_FIXED
        run: |
          set -e
          grep -Fq 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Fq 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Fq 'jvmTarget = "17"' app/build.gradle.kts
          gradle --version

      # 8. Clean project
      - name: Clean project
        working-directory: build-src/RAZA_AI_Complete_Android_FIXED
        run: gradle clean --no-daemon --stacktrace

      # 9. Run unit tests
      - name: Run unit tests
        working-directory: build-src/RAZA_AI_Complete_Android_FIXED
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      # 10. Build APK
      - name: Build Debug APK
        working-directory: build-src/RAZA_AI_Complete_Android_FIXED
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 11. Verify APK
      - name: Verify APK
        working-directory: build-src/RAZA_AI_Complete_Android_FIXED
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      # 12. Upload APK
      - name: Upload RAZA AI APK
        uses: actions/upload-artifact@v4
        with:
          name: RAZA-AI-DEBUG-APK
          path: build-src/RAZA_AI_Complete_Android_FIXED/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # 13. Upload test reports if build fails
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAZA-AI-TEST-REPORTS
          path: build-src/RAZA_AI_Complete_Android_FIXED/app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7
          
