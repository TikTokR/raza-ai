name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend API tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run backend tests
        working-directory: backend
        run: npm test

  android:
    name: Build, test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project root
        run: |
          set -e
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.raza.ai"' app/build.gradle.kts
          echo "Project root OK: $(pwd)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub Ubuntu runner ships with an Android SDK (ANDROID_HOME).
      # android-actions/setup-android@v3 fails here because it requests the
      # retired "tools" package, so we use the preinstalled SDK directly.
      - name: Install Android SDK packages
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)"; fi
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version

      - name: Verify Java and Kotlin JVM targets are both 17
        run: |
          set -e
          grep -Fq 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Fq 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Fq 'jvmTarget = "17"' app/build.gradle.kts

      - name: Set up Node 22 (for the API integration test)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start the real backend (no AI provider key) for API integration tests
        run: |
          cd backend
          RAZA_API_TOKENS="ci-user-token-0123456789:user,ci-admin-token-0123456789:admin" PORT=18080 ANTHROPIC_API_KEY= \
            nohup node src/server.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/api/v1/health && break || sleep 1
          done
          curl -fsS http://127.0.0.1:18080/api/v1/health

      - name: Unit tests
        env:
          RAZA_IT_URL: http://127.0.0.1:18080
          RAZA_IT_TOKEN: ci-user-token-0123456789
          RAZA_IT_NO_PROVIDER: "1"
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Summarize unit test results (fails if no tests ran)
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re, sys
          total = skipped = failed = errors = 0
          files = sorted(glob.glob("app/build/test-results/testDebugUnitTest/TEST-*.xml"))
          for p in files:
              head = open(p, encoding="utf8").read(3000)
              m = re.search(r'name="([^"]+)" tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', head)
              if not m:
                  continue
              n, t, s, f, e = m.groups()
              total += int(t); skipped += int(s); failed += int(f); errors += int(e)
              print(f"{n.split('.')[-1]:36} tests={t:>3} skipped={s} failures={f} errors={e}")
          print(f"UNIT TEST TOTAL: files={len(files)} tests={total} skipped={skipped} failures={failed} errors={errors}")
          if total == 0:
              print("ERROR: no unit tests were executed")
              sys.exit(1)
          it = [p for p in files if p.endswith("BackendIntegrationTest.xml")]
          if not it:
              print("ERROR: BackendIntegrationTest did not run")
              sys.exit(1)
          m = re.search(r'tests="(\d+)" skipped="(\d+)"', open(it[0], encoding="utf8").read(3000))
          if m.group(2) != "0":
              print(f"ERROR: {m.group(2)} integration test(s) were skipped in CI")
              sys.exit(1)
          EOF

      - name: Lint (non-blocking report)
        continue-on-error: true
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and is non-trivial
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          test "$SIZE" -gt 100000

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAZA-AI-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAZA-AI-REPORTS
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
