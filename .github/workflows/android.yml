name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build, test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate project root
        run: |
          set -e
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.raza.ai"' app/build.gradle.kts
          echo "Project root OK: $(pwd)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Show toolchain versions
        run: |
          java -version
          gradle --version

      - name: Verify Java and Kotlin JVM targets are both 17
        run: |
          set -e
          grep -Fq 'sourceCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Fq 'targetCompatibility = JavaVersion.VERSION_17' app/build.gradle.kts
          grep -Fq 'jvmTarget = "17"' app/build.gradle.kts

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint (non-blocking report)
        continue-on-error: true
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK exists and is non-trivial
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK: $APK ($SIZE bytes)"
          test "$SIZE" -gt 100000

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RAZA-AI-DEBUG-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RAZA-AI-REPORTS
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
